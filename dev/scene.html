<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xem thử mô hình 3D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0b0d;
        overflow: hidden;
      }
      body.light {
        background: #f3eee3;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        opacity: 1 !important;
      }
      #frame {
        position: fixed;
        border: 1px dashed rgba(233, 180, 76, 0.5);
        pointer-events: none;
      }
      #hud {
        position: fixed;
        left: 10px;
        bottom: 10px;
        font: 12px monospace;
        color: #e9b44c;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="frame"></div>
    <div id="labels" style="position: fixed; inset: 0; pointer-events: none"></div>
    <div id="hud"></div>
    <script type="module" src="/src/dev/scene-preview.ts"></script>
  </body>
</html>
